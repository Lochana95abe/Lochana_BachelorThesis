[General]
ned-path = src
network = uav_mec_sim04.Sim04Network
sim-time-limit = 120s

# results files per run
output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec

# faster batch runs
cmdenv-express-mode = true
record-eventlog = false

# Positions
*.u0.posX = 100m
*.u0.posY = 100m
*.u1.posX = 260m
*.u1.posY = 140m
*.u2.posX = 260m
*.u2.posY = 360m
*.e0.posX = 500m
*.e0.posY = 250m

# Mobility placeholders
*.u1.velX = 1mps
*.u2.velX = -1mps

# Arrival and task packaging
*.u0.meanInterArrival = 0.5s          # [Ahybridfastinferenceapproachwithdistributedneuralnetworksfor.pdf, p.8]
*.u0.imagesPerTask = 5                # [Ahybridfastinferenceapproachwithdistributedneuralnetworksfor.pdf, p.8]

# Deadlines
*.u0.deadline = 1s                    # inside 0.6 to 1.8 s [Ahybridfastinferenceapproachwithdistributedneuralnetworksfor.pdf, p.8]

# Base link rate anchor
*.e0.baseRate = 94Mbps                # [Toward 5G Edge Computing for Enabling Autonomous Aerial Vehicles.pdf, p.13]

# Feature shrink anchor
*.e0.featureShrinkMid = 0.25          # 75 percent reduction anchor [A_Fine-Grained_End-to-End_Latency_Optimization_Framework_for_Wireless_Collaborative_Inference.pdf, p.2]

# Monitoring and triggers
*.e0.statusPeriod = 0.1s
*.e0.heartbeatTimeout = 0.3s
*.u1.statusPeriod = 0.1s
*.u2.statusPeriod = 0.1s

# Baselines and main algorithm configs
[Config Sim04_AEGIS_relaxed_normal]
repeat = 10
seed-set = ${repetition}
*.e0.policy = "AEGIS"
*.u1.enableFailures = false
*.u2.enableFailures = false
*.e0.enableEdgeOutage = false

[Config Sim04_LOCAL_relaxed_normal]
extends = Sim04_AEGIS_relaxed_normal
*.e0.policy = "LOCAL"

[Config Sim04_EDGE_relaxed_normal]
extends = Sim04_AEGIS_relaxed_normal
*.e0.policy = "EDGE"

[Config Sim04_STATIC_relaxed_normal]
extends = Sim04_AEGIS_relaxed_normal
*.e0.policy = "STATIC"

[Config Sim04_NAIVE_relaxed_normal]
extends = Sim04_AEGIS_relaxed_normal
*.e0.policy = "NAIVE"

# Stress scenario: peer failures and edge outage enabled
[Config Sim04_AEGIS_relaxed_stress]
repeat = 10
seed-set = ${repetition}
extends = Sim04_AEGIS_relaxed_normal
*.e0.policy = "AEGIS"
*.u1.enableFailures = true
*.u2.enableFailures = true
*.u1.downStart = 40s
*.u1.downEnd = 60s
*.u2.downStart = 55s
*.u2.downEnd = 70s
*.e0.enableEdgeOutage = true
*.e0.edgeDownStart = 70s
*.e0.edgeDownEnd = 90s

[Config Sim04_STATIC_relaxed_stress]
extends = Sim04_AEGIS_relaxed_stress
*.e0.policy = "STATIC"

[Config Sim04_NAIVE_relaxed_stress]
extends = Sim04_AEGIS_relaxed_stress
*.e0.policy = "NAIVE"

# Tight deadline stress based on MLPerf bounds
[Config Sim04_AEGIS_tight_normal]
repeat = 10
seed-set = ${repetition}
extends = Sim04_AEGIS_relaxed_normal
*.u0.deadline = 0.05s                 # 50 ms multistream bound [MLPerf Inference Benchmark.pdf, p.6]
*.e0.policy = "AEGIS"

[Config Sim04_AEGIS_tight_stress]
repeat = 10
seed-set = ${repetition}
extends = Sim04_AEGIS_relaxed_stress
*.u0.deadline = 0.05s                 # [MLPerf Inference Benchmark.pdf, p.6]
*.e0.policy = "AEGIS"