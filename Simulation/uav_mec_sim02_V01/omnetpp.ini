[General]
ned-path = src
network = uav_mec_sim02.Sim02Network
sim-time-limit = 120s

# node positions for locality effect
*.u0.posX = 100m
*.u0.posY = 100m
*.u1.posX = 260m
*.u1.posY = 140m
*.u2.posX = 260m
*.u2.posY = 360m
*.e0.posX = 500m
*.e0.posY = 250m

# compute placeholders
*.u1.computePerStage = 10ms
*.u2.computePerStage = 10ms
*.e0.computePerStage = 8ms

# planner placeholders
*.e0.plannerDelay = 2ms
*.e0.cellSize = 250m
*.e0.neighborCells = 1

# relaxed regime defaults, arrival period and task packaging come from your provided reference [Ahybridfastinferenceapproachwithdistributedneuralnetworksfor.pdf, p.8]
*.u0.taskStartTime = 1s
*.u0.meanInterArrival = 0.5s
*.u0.imagesPerTask = 5
*.u0.deadline = 1s

[Config Sim02_AEGIS_relaxed]
*.e0.policy = "AEGIS"

[Config Sim02_LOCAL_relaxed]
*.e0.policy = "LOCAL"

[Config Sim02_EDGE_relaxed]
*.e0.policy = "EDGE"

[Config Sim02_STATIC_relaxed]
*.e0.policy = "STATIC"

[Config Sim02_NAIVE_relaxed]
*.e0.policy = "NAIVE"

# tight regime deadline example inside 50 ms to 100 ms style bounds [MLPerf Inference Benchmark.pdf, p.6]
[Config Sim02_AEGIS_tight]
extends = Sim02_AEGIS_relaxed
*.u0.deadline = 0.1s
*.e0.policy = "AEGIS"

[Config Sim02_LOCAL_tight]
extends = Sim02_AEGIS_tight
*.e0.policy = "LOCAL"

[Config Sim02_EDGE_tight]
extends = Sim02_AEGIS_tight
*.e0.policy = "EDGE"

[Config Sim02_STATIC_tight]
extends = Sim02_AEGIS_tight
*.e0.policy = "STATIC"

[Config Sim02_NAIVE_tight]
extends = Sim02_AEGIS_tight
*.e0.policy = "NAIVE"